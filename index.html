<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="styles.css"/>

</head>
<body>
    <div class="container">
        <div class="background-logo" >
            <div class="logo">   
                <img src="images/odin-lined.png"> 
                <h1>ODIN</h1>                         
            </div>
            <p>Photo by <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Halie West</a> on <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Unsplash</a></p>
        </div>
        <div class="main-content">
            <header>
                <p>This is not a real online service!
                    You know you need somethinglike this in your life
                    to help you realize your deepest dreams.
                    Sign up now to get started.
                    You know you want to.
                </p>
            </header>
                
            <form id="signupform" >
                <h1>Let's Do this!</h1>
                <div>
                    <label for="firstname">First Name</label>
                    <input type="text" id="firstname" required>
                </div>
                
                <div>
                    <label for="lastname">Last Name</label>
                    <input type="text" id="lastname" required>
                </div>
                
                <div>
                    <label for="user_email">Email</label>
                    <input type="email" id="user_email" required>
                </div>
                
                <div>
                    <label for="phonenumber">Phone Number</label>
                    <input type="number" id="phonenumber" required>
                </div>
                
                <div>
                    <label for="user_password">Password</label>
                    <input type="password" id="user_password" required>
                </div>
                
                <div>
                    <label for="user_password">Confirm Password</label>
                    <input  type="password" id="user_password" minlength="8" maxlength="16" required>
                </div>
                
                
            </form>
                <div class="submit-button">
                    <button type="submit" form="signupform">Create Account</button>
                    <p>Already have an account? <a>Log in</a></p>
                </div>
            
            
        </div>
    </div>
</body>
</html>
